name: Build Procura (Windows EXE + Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # Windows: installer (auto-updating) + portable EXE, published to a
  # GitHub Release tagged v1.0.<run number>. This job is unchanged from
  # the version that already works.
  # ---------------------------------------------------------------
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (fresh, for Windows)
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps 2>&1 | tee install.log

      - name: Set app version from run number (each push = a new update)
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version 2>&1 | tee version.log

      - name: Build web app (desktop mode)
        run: npm run build:desktop 2>&1 | tee web.log

      - name: Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish always 2>&1 | tee pack.log

  # ---------------------------------------------------------------
  # Android: builds the APK and attaches it to the SAME release as the
  # Windows files, so one release page has both downloads.
  # Capacitor 8 needs Node 22+ and Java 21.
  # ---------------------------------------------------------------
  build-android:
    name: Android APK
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build web app (mobile mode)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Procura-Android.apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v1.0.${{ github.run_number }}" build-output/Procura-Android.apk --clobber --repo "${{ github.repository }}"
