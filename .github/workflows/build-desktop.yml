name: Build Windows Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (fresh, for Windows)
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps 2>&1 | tee install.log

      - name: Set app version from run number (each push = a new update)
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version 2>&1 | tee version.log

      - name: Build web app (desktop mode)
        run: npm run build:desktop 2>&1 | tee web.log

      - name: Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish always 2>&1 | tee pack.log

      - name: Save build logs to a branch (always)
        if: always()
        run: |
          mkdir -p ../ci-logs
          cp *.log ../ci-logs/ 2>/dev/null || true
          echo "run ${{ github.run_id }} status ${{ job.status }}" > ../ci-logs/status.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . -q
          cp ../ci-logs/* .
          git add -A
          git commit -q -m "build logs run ${{ github.run_id }}"
          git push -f origin build-logs
