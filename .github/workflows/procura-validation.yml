name: Procura validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  validate-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: procura
          POSTGRES_PASSWORD: procura_test_password
          POSTGRES_DB: procura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procura -d procura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Compile backend
        run: npm run build
      - name: Run security unit tests
        run: npm test
      - name: Validate PostgreSQL schema
        env:
          PGPASSWORD: procura_test_password
        run: psql -h localhost -U procura -d procura_test -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.sql
