name: Build Android APK & Web App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Phones & Tablets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync or Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          fi
          npx --yes @capacitor/cli sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Procura-Procurement-Mobile.apk \;
          echo "APK generated successfully"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Procura-Android-APK
          path: build-output/Procura-Procurement-Mobile.apk
          retention-days: 30
