name: Build Android APK & Web App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Phones & Tablets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync or Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          fi
          npx --yes @capacitor/cli sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Procura-Procurement-Mobile.apk \;
          echo "APK generated successfully"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Procura-Android-APK
          path: build-output/Procura-Procurement-Mobile.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: Procura Procurement & Asset Management Mobile APK
          body: |
            ### Procura Mobile Android App (APK)
            Official Android production build for the Final Year Project (FYP).
            - **Brand**: Official emerald & gold theme and custom launcher icons (no legacy blue/white robot icons)
            - **Currency**: Full support for Nigerian Naira (₦) throughout dashboards, requisitions, budgets, and vouchers
            - **Downloads**: Clean, natural navigation title bar
            
            Download `Procura-Procurement-Mobile.apk` below directly to your Android device to install and test.
          files: build-output/Procura-Procurement-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

